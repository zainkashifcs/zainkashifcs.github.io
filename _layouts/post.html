---
layout: default
---
<article class="post">
  <header>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
      {% include tags.html tags=page.tags %}
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.solution != blank %}
      <a class="btn" href="{{ site.solutions_repo }}/blob/main/{{ page.solution | uri_escape }}">View solution on GitHub</a>
    {% endif %}
  </header>
  {% if page.link != blank %}
    <h2>Problem</h2>
    <p><a href="{{ page.link }}">Read the problem statement</a></p>
  {% endif %}
  {{ content }}
</article>
