<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site">
    <a class="prompt" href="{{ '/' | relative_url }}">zain@cp:<span>~{{ page.url | remove: 'index.html' }}</span>$</a>
    <nav>
      <a href="{{ '/' | relative_url }}">posts</a>
      <a href="{{ '/tags/' | relative_url }}">tags</a>
      <a href="{{ '/about/' | relative_url }}">about</a>
      <a href="{{ site.solutions_repo }}">solutions repo</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
</body>
</html>
