title: Zain's Blog
description: Zain's Blog. Notes from my competitive programming practice, mostly Codeforces.
solutions_repo: https://github.com/zainkashifcs/comp-program-grind
permalink: /posts/:title/
# Codeforces handle for the profile section. Left empty until confirmed: "amaza1nn__" returned "not found" from
# the Codeforces API on 6 Nov 2026, so nothing is fetched or shown yet (see _scripts/fetch_codeforces.py).
codeforces_handle: ""

# One page per archive problem without a write-up; the stubs in _problems/ are written by _scripts/build_problems.py.
collections:
  problems:
    output: true
    permalink: /problems/:name/
  # Monthly progress notes written by Zain; months without notes still show their facts on /journal/.
  journal:
    output: true
    permalink: /journal/:name/

# Excerpts are not used anywhere; turning them off avoids warnings from the {% raw %} blocks in generated pages.
defaults:
  - scope: { type: posts }
    values: { layout: post, excerpt_separator: "" }
  - scope: { type: pages }
    values: { layout: default }
  - scope: { type: problems }
    values: { layout: problem, excerpt_separator: "" }
  - scope: { type: journal }
    values: { layout: journal-entry }

exclude: [README.md, make_post.py, skills-lock.json, Gemfile, Gemfile.lock, vendor]
