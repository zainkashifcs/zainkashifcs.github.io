title: Zain's Blog
description: Zain's Blog. Notes from my competitive programming practice, mostly Codeforces.
solutions_repo: https://github.com/zainkashifcs/comp-program-grind
permalink: /posts/:title/

defaults:
  - scope: { type: posts }
    values: { layout: post }
